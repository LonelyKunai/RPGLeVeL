# Tienda del servidor (/shop).
# STOCK EN STACKS: la capacidad de cada objeto es  stacks * tamaño de pila  (en unidades, que es lo que usa el plugin):
#   high   = 40 stacks (x64)  -> minerales
#   medium = 16 stacks (x64)  -> materias primas renovables
#   low    =  4 stacks (x64)  -> objetos de poca frecuencia (pila de 64)
#   low_pila16 = 4 stacks (x16) -> objetos de poca frecuencia con pila de 16 (perla de ender)
#   Los objetos no apilables (p. ej. tótem) no están en la tienda: un "stack" de 1 no tiene sentido como stock.
# Capacidad final = capacity[nivel] * (1 + players_factor * jugadores activos en los últimos active_days días).
# RELLENO: cada semana (refill_day / refill_hour) el stock sube hasta la capacidad y se reinician los límites de compra.
# PRECIO = precio base * multiplicador(stock/capacidad): entre min_multiplier (stock lleno) y max_multiplier (casi agotado).
#   Lo que los jugadores VENDEN a la tienda sube el stock y baja el precio; lo que compran lo baja y sube el precio.
# LÍMITES por ciclo: un jugador puede comprar como máximo player_limit (15%) de la capacidad de un objeto; un gremio entero
#   (suma de sus miembros) como máximo guild_limit (40%).
# PRECIOS BASE (monedas) calibrados por la forma de obtener cada objeto, sin contar misiones:
#   - Minerales y objetos raros: 1000 monedas por hora de esfuerzo / unidades que se consiguen por hora
#     (1000 = ingreso medio con trabajos: 0,5 monedas por XP de trabajo, ~3 XP por mena + botín de monedas).
#     Ej.: carbón ~700/h = 2, hierro ~250/h = 4-5, diamante ~17/h = 59, esquirla de eco ~5/h = 200.
#   - Materias primas renovables: valen lo que paga el trabajo por conseguirlas (1-3 monedas); lo regula sobre todo el stock.
#   - Materiales de forja (steel_ingot, cobalt_ingot, sky_ingot, dragon_core): coste de sus ingredientes + 25% de crafteo.
#   - Gemas: nivel 1 ~ lo que cuesta conseguirla de botín (~170 muertes); nivel 2 = 3 de nivel 1 + 10%.
# Claves de objeto: MATERIAL vanilla, id de ítem .rlvp (steel_ingot...) o gem:<id>:<nivel>. Valor = precio base en monedas.
settings:
  capacity:
    high: 2560
    medium: 1024
    low: 256
    low_pila16: 64
  players_factor: 0.15
  active_days: 14
  player_limit: 0.15
  guild_limit: 0.4
  sell_ratio: 0.5
  sell_overflow: 1.5
  price:
    min_multiplier: 0.75
    max_multiplier: 2.5
    exponent: 1.5
  refill_day: MONDAY
  refill_hour: 4
  announce_refill: true

# Habilidades de oficio (/jobs abilities). Se desbloquean por nivel del trabajo (unlock.job_level), por rango permanente de trabajo (unlock.rank)
# o al azar como recompensa de misiones/mazmorras/jefes (unlock.random). Solo funcionan con el trabajo activo en una ranura.
# El nivel de cada habilidad sube solo con el nivel del trabajo: 1 + (nivel-1)/level_step.
settings:
  level_step_default: 10
  random_chance:
    daily: 0.03
    weekly: 0.2
    chain: 1.0
    dungeon: 0.15
    boss: 0.1
